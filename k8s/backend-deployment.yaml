apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-backend
  namespace: chess-app
  labels:
    app: chess-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-backend
  template:
    metadata:
      labels:
        app: chess-backend
    spec:
      containers:
        - name: chess-backend
          image: gcr.io/hedmana-chess-app/chess-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: ALLOWED_ORIGINS
              value: "https://chess.axelhedman.fi"
            - name: DEFAULT_ENGINE
              value: "stockfish"
            - name: STOCKFISH_PATH
              value: "/usr/games/stockfish"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chess-backend
  namespace: chess-app
spec:
  selector:
    app: chess-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
