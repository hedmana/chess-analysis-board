# Cloud Build CI/CD Pipeline for Chess App
substitutions:
  _REGION: europe-north1
  _CLUSTER: chess-app-cluster

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chess-backend:latest'
      - './backend'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chess-frontend:latest'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://chess.axelhedman.fi/api'
      - './frontend'

  # Push all images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chess-backend:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chess-frontend:latest']

  # Deploy to GKE
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=k8s/'
      - '--location=${_REGION}'
      - '--cluster=${_CLUSTER}'
      - '--image=gcr.io/$PROJECT_ID/chess-backend:latest'
      - '--image=gcr.io/$PROJECT_ID/chess-frontend:latest'

images:
  - 'gcr.io/$PROJECT_ID/chess-backend:latest'
  - 'gcr.io/$PROJECT_ID/chess-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
